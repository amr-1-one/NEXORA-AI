
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>NEXORA AI — مساعدك الذكي</title>
  <meta name="description" content="NEXORA AI — مساعدك الذكي للتعلم والبرمجة والكتابة والإبداع.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div><b>NEXORA AI</b><small>مساحة أفكارك الذكية</small></div>
      </div>

      <button class="new-chat" id="newChat">＋ محادثة جديدة</button>
      <div class="side-label">محادثاتك</div>
      <div id="history" class="history"></div>

      <div class="sidebar-bottom">
        <div class="profile">
          <div class="avatar" id="profileAvatar">N</div>
          <div>
            <b id="profileName">زائر</b>
            <small id="profileEmail">سجّل الدخول لحفظ محادثاتك</small>
          </div>
        </div>
        <button class="auth-side-btn" id="authOpen">تسجيل الدخول / إنشاء حساب</button>
        <button class="logout-btn hidden" id="logoutBtn">تسجيل الخروج</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-right">
          <button class="mobile-menu" id="menuBtn">☰</button>
          <div class="model-name">
            <span class="status-dot"></span>
            NEXORA AI
            <span class="model-tag">AI Assistant</span>
          </div>
        </div>
        <button class="clear-btn" id="clearChat">مسح المحادثة</button>
      </header>

      <section class="conversation" id="conversation">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">✦</div>
          <div class="eyebrow">مساحة ذكية لكل أفكارك</div>
          <h1>أهلاً بك في <span>NEXORA AI</span></h1>
          <p>اسأل، تعلّم، ابتكر، ودعنا نبدأ من هنا.</p>

          <div class="suggestions">
            <button class="suggestion" data-prompt="اشرح لي الذكاء الاصطناعي بطريقة بسيطة">💡 اشرح لي موضوعًا</button>
            <button class="suggestion" data-prompt="ساعدني في كتابة كود JavaScript بسيط">⌨️ اكتب لي كودًا</button>
            <button class="suggestion" data-prompt="اعمل لي خطة مذاكرة منظمة لمدة أسبوع">📚 ساعدني في المذاكرة</button>
            <button class="suggestion" data-prompt="اقترح أفكارًا لمشروع موقع إلكتروني مميز">🚀 اقترح أفكارًا</button>
          </div>
        </div>

        <div id="messages" class="messages" aria-live="polite"></div>
      </section>

      <footer class="composer-wrap">
        <form id="chatForm" class="composer">
          <textarea id="prompt" rows="1" placeholder="اكتب رسالتك إلى NEXORA AI..." aria-label="رسالتك"></textarea>
          <button id="sendBtn" class="send-btn" type="submit">↑</button>
        </form>
        <div class="disclaimer">
          قد يخطئ NEXORA AI أحيانًا؛ راجع المعلومات المهمة.
        </div>
      </footer>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="authModal">
    <div class="auth-modal">
      <button class="modal-close" id="authClose">×</button>
      <div class="modal-brand">✦</div>
      <h2 id="authTitle">مرحبًا بك في NEXORA</h2>
      <p class="modal-subtitle">سجّل دخولك لحفظ محادثاتك.</p>

      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTab" type="button">تسجيل الدخول</button>
        <button class="auth-tab" id="signupTab" type="button">إنشاء حساب</button>
      </div>

      <form id="authForm">
        <label for="authEmail">البريد الإلكتروني</label>
        <input id="authEmail" type="email" autocomplete="email" required>

        <label for="authPassword">كلمة المرور</label>
        <input id="authPassword" type="password" minlength="6" required>

        <button class="auth-submit" id="authSubmit" type="submit">تسجيل الدخول</button>\n        <button class="auth-reset-link" id="resetPasswordBtn" type="button">نسيت كلمة المرور؟</button>
      </form>

      <p class="auth-message" id="authMessage"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
